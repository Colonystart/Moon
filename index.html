<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030407">
<title>Happy Birthday Moon</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030407}
body{font-family:Georgia,'Times New Roman',serif;color:white}
.stage{position:relative;width:100%;height:100%;height:100svh;overflow:hidden;background:#030407}
.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;will-change:transform,opacity}
/* One continuous 30-second sequence: wide view -> medium view -> close-up. */
.shot1{animation:shot1 18s ease-in-out infinite}
.shot2{animation:shot2 18s ease-in-out infinite}
.shot3{animation:shot3 18s ease-in-out infinite}
@keyframes shot1{
  0%{opacity:1;transform:scale(1)}
  24%{opacity:1;transform:scale(1.06)}
  33.33%{opacity:0;transform:scale(1.08)}
  100%{opacity:0;transform:scale(1.08)}
}
@keyframes shot2{
  0%,29%{opacity:0;transform:scale(1)}
  36%{opacity:1;transform:scale(1)}
  57%{opacity:1;transform:scale(1.06)}
  66.66%{opacity:0;transform:scale(1.08)}
  100%{opacity:0;transform:scale(1.08)}
}
@keyframes shot3{
  0%,62%{opacity:0;transform:scale(1)}
  69%{opacity:1;transform:scale(1)}
  96%{opacity:1;transform:scale(1.08)}
  100%{opacity:1;transform:scale(1.08)}
}
.tint{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,#0005 0%,transparent 28%,transparent 66%,#0008 100%)}
.twinkles{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.38;background-image:radial-gradient(1px 1px at 12% 18%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 82% 24%,#fff 99%,transparent),radial-gradient(1px 1px at 72% 76%,#fff 99%,transparent),radial-gradient(1px 1px at 23% 68%,#fff 99%,transparent);animation:twinkle 3s ease-in-out infinite alternate}
.heading{position:absolute;z-index:4;left:50%;top:12%;width:94%;transform:translateX(-50%);text-align:center;opacity:0;animation:heading 18s ease-in-out infinite}
.heading h1{margin:0;color:#fff0d3;font-size:clamp(2.5rem,9vw,5.8rem);font-style:italic;font-weight:400;line-height:1.04;text-shadow:0 0 12px #ffdf9b,0 0 34px #ffc76c;}
.heading p{margin:14px 0 0;font:10px Arial,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#fff0d3}
@keyframes heading{0%,66%{opacity:0}73%,94%{opacity:1}100%{opacity:0}}
@keyframes twinkle{from{opacity:.15}to{opacity:.5}}
.footer{position:absolute;z-index:4;bottom:20px;left:0;width:100%;text-align:center;font:9px Arial,sans-serif;letter-spacing:.22em;color:#ffffff9c}
@media(prefers-reduced-motion:reduce){
 .shot1,.shot2,.shot3,.heading,.twinkles{animation:none}
 .shot1{opacity:0}.shot2{opacity:0}.shot3{opacity:1}.heading{opacity:1}
}
</style>
</head>
